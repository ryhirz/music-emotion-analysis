name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 依赖从锁文件 requirements.txt 安装，并强制校验 sha256。
      # 锁文件由 .github/workflows/lockfiles.yml 在同样的 Ubuntu + Python 3.13 上生成，
      # 每个传递依赖（含 numpy/numba/scipy/librosa 这组互相敏感的包）都被钉死版本 + 哈希，
      # 因此不会再出现「本地好好的、CI 全新安装装到新版本就挂」的情况。
      # 测试依赖 pytest 已包含在锁文件内，无需单独安装。
      - name: 安装依赖（从锁文件，强制校验哈希）
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      # 语法层面把关：所有脚本必须能通过字节码编译
      - name: 语法编译检查
        run: python -m compileall -q app.py scripts tests

      # 冒烟测试：映射表一致性 / 标注函数行为 / 特征维度与模型产物一致
      # 刻意不依赖音频文件与 librosa，因此无需下载 GTZAN 即可稳定复现
      - name: 运行冒烟测试
        run: python -m pytest tests -q

      # 说明：GTZAN 原始音频约 1.3GB（.gitignore 已排除），CI 不下载数据集，
      # 因此特征提取与训练的端到端链路不在本流水线覆盖范围内。
